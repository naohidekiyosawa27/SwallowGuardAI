[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swallowguard-research"
version = "0.3.0"
description = "RESEARCH MODE event recognition and bench acquisition tools"
requires-python = ">=3.11"
dependencies = ["numpy==2.0.2", "scipy==1.15.3", "scikit-learn==1.6.1"]

[project.optional-dependencies]
tinyml = ["tensorflow-cpu==2.18.1", "numpy==2.0.2"]

[tool.setuptools.packages.find]
where = ["src"]
