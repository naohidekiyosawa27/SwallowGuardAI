name: Optional bounded QAT synthetic check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qat-synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-qat.txt
      - name: Synthetic QAT contracts only
        env:
          TF_USE_LEGACY_KERAS: "1"
          PYTHONPATH: src
          CUDA_VISIBLE_DEVICES: "-1"
        run: python -m unittest discover -s tests -p 'test_bounded.py' -v
