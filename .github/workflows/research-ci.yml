name: Research synthetic checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-and-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - run: bash scripts/verify.sh
  esp-idf-simulator:
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.3.2
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build synthetic-only firmware
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          cd firmware
          idf.py set-target esp32s3
          idf.py build
