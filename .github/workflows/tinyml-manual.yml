name: Optional TinyML synthetic export check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tensorflow-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e '.[tinyml]'
      - run: python scripts/check_tinyml.py
